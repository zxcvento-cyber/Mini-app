<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Поездки Абакан ⇄ Томск</title>
  <!-- VK Bridge SDK для интеграции с мобильным клиентом VK -->
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <style>
    :root {
      --primary: #2688eb;
      --bg: #ebedf0;
      --card-bg: #ffffff;
      --text: #000000;
      --text-sub: #818c99;
      --green: #4bb34b;
      --red: #e64646;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Roboto', 'Segoe UI', sans-serif;
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    .header {
      text-align: center;
      margin-bottom: 14px;
    }
    .header h2 {
      margin: 0 0 4px 0;
      font-size: 20px;
    }
    .header p {
      margin: 0;
      font-size: 13px;
      color: var(--text-sub);
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px 6px;
      border: none;
      border-radius: 10px;
      background: #dce1e6;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
    }
    .calendar-container {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .month-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 16px;
    }
    .weekdays-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      font-size: 12px;
      color: var(--text-sub);
      font-weight: 600;
      margin-bottom: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .day-cell {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f7f8fa;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      position: relative;
      border: 1px solid transparent;
      user-select: none;
    }
    .day-cell.empty {
      background: transparent;
      cursor: default;
    }
    .day-cell.has-ride {
      background: #eaf7ea;
      border-color: #a3e2a3;
      color: #1b631b;
      font-weight: 700;
    }
    .day-cell .dot {
      width: 5px;
      height: 5px;
      background: var(--green);
      border-radius: 50%;
      margin-top: 2px;
    }
    .day-cell.selected {
      border: 2px solid var(--primary);
      background: #e5f1ff;
    }
    .rides-list {
      margin-top: 14px;
    }
    .ride-card {
      background: #f2f7fc;
      border-left: 4px solid var(--primary);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ride-card h4 {
      margin: 0 0 4px 0;
      font-size: 15px;
    }
    .ride-card p {
      margin: 0;
      font-size: 12px;
      color: var(--text-sub);
    }
    .book-btn-mini {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    /* Модальное окно бронирования */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }
    .modal-box {
      background: #fff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      box-sizing: border-box;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 4px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #dce1e6;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 15px;
      outline: none;
    }
    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-cancel {
      width: 100%;
      background: none;
      border: none;
      padding: 12px;
      color: var(--text-sub);
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>Поездки Абакан ⇄ Томск</h2>
    <p>Выберите дату и забронируйте поездку онлайн</p>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" id="btn-abk" onclick="changeDirection('Абакан → Томск')">Абакан ➔ Томск</button>
    <button class="tab-btn" id="btn-tsk" onclick="changeDirection('Томск → Абакан')">Томск ➔ Абакан</button>
  </div>

  <div class="calendar-container">
    <div class="month-header">
      <span id="month-label">Октябрь 2026</span>
    </div>

    <div class="weekdays-row">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <div class="rides-list" id="rides-container"></div>

  <!-- Модальное окно оформления -->
  <div id="modal">
    <div class="modal-box">
      <h3 style="margin-top: 0; margin-bottom: 6px;" id="modal-title">Оформление поездки</h3>
      <p style="margin-top: 0; font-size: 13px; color: var(--text-sub);" id="modal-sub"></p>

      <div class="form-group">
        <label>Количество мест:</label>
        <select id="input-seats">
          <option value="1">1 пассажирское место</option>
          <option value="2">2 места</option>
          <option value="3">3 места</option>
          <option value="4">4 места</option>
        </select>
      </div>

      <div class="form-group">
        <label>Багаж:</label>
        <select id="input-bag">
          <option value="Маленький">Рюкзак / Ручная кладь</option>
          <option value="Чемодан">Стандартный чемодан</option>
          <option value="Большой">Много багажа / Крупногабарит</option>
        </select>
      </div>

      <div class="form-group">
        <label>Контактный телефон:</label>
        <input type="tel" id="input-phone" placeholder="+7 999 000-00-00">
      </div>

      <button class="btn-submit" onclick="confirmBooking()">Подтвердить бронь</button>
      <button class="btn-cancel" onclick="closeModal()">Закрыть</button>
    </div>
  </div>

  <script>
    // Вставьте сюда публичный HTTPS-адрес вашего сервера (например, https://xxxx.ngrok-free.app или ваш домен)
    const BACKEND_URL = " https://wide-bugs-visit.loca.lt";

    let vkUserData = { id: 0, first_name: "Пассажир", last_name: "" };

    // Инициализация VK Bridge и чтение данных профиля
    if (window.vkBridge) {
      vkBridge.send('VKWebAppInit');
      vkBridge.send('VKWebAppGetUserInfo').then(user => {
        if (user) {
          vkUserData = user;
        }
      }).catch(err => console.log('VK Bridge user info error:', err));
    }

    // Список активных рейсов
    const schedule = [
      { id: "R1", dir: "Абакан → Томск", day: 10, dateStr: "10 октября", time: "19:00", seats: 3 },
      { id: "R2", dir: "Томск → Абакан", day: 12, dateStr: "12 октября", time: "08:00", seats: 4 }
    ];

    let currentDir = "Абакан → Томск";
    let selectedDay = 10;
    let selectedRide = schedule[0];

    function changeDirection(dir) {
      currentDir = dir;
      document.getElementById('btn-abk').classList.toggle('active', dir === 'Абакан → Томск');
      document.getElementById('btn-tsk').classList.toggle('active', dir === 'Томск → Абакан');
      
      const firstAvailable = schedule.find(s => s.dir === currentDir);
      if (firstAvailable) {
        selectedDay = firstAvailable.day;
        selectedRide = firstAvailable;
      } else {
        selectedDay = null;
        selectedRide = null;
      }
      render();
    }

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      // Октябрь 2026: 1-е число — четверг (сдвиг 3 ячейки)
      const offset = 3; 
      const totalDays = 31;

      for (let i = 0; i < offset; i++) {
        const empty = document.createElement('div');
        empty.className = 'day-cell empty';
        grid.appendChild(empty);
      }

      for (let d = 1; d <= totalDays; d++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        cell.innerText = d;

        const ride = schedule.find(s => s.dir === currentDir && s.day === d);
        if (ride) {
          cell.classList.add('has-ride');
          const dot = document.createElement('div');
          dot.className = 'dot';
          cell.appendChild(dot);
        }

        if (d === selectedDay) {
          cell.classList.add('selected');
        }

        cell.onclick = () => {
          selectedDay = d;
          selectedRide = schedule.find(s => s.dir === currentDir && s.day === d) || null;
          render();
        };

        grid.appendChild(cell);
      }

      // Карточка под календарем
      const container = document.getElementById('rides-container');
      container.innerHTML = '';

      if (selectedRide) {
        container.innerHTML = `
          <div class="ride-card">
            <div>
              <h4>${selectedRide.dateStr}, в ${selectedRide.time}</h4>
              <p>Свободно мест: <b>${selectedRide.seats}</b></p>
            </div>
            <button class="book-btn-mini" onclick="openModal()">Забронировать</button>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="ride-card" style="border-left-color: #818c99;">
            <div>
              <h4>На ${selectedDay} октября рейсов нет</h4>
              <p>Оставьте заявку в лист ожидания на этот день</p>
            </div>
            <button class="book-btn-mini" style="background:#4bb34b;" onclick="openCustomModal(${selectedDay})">Оставить заявку</button>
          </div>
        `;
      }
    }

    function openModal() {
      document.getElementById('modal-title').innerText = currentDir;
      document.getElementById('modal-sub').innerText = `Рейс: ${selectedRide.dateStr} в ${selectedRide.time} (свободно: ${selectedRide.seats})`;
      
      const select = document.getElementById('input-seats');
      select.innerHTML = '';
      for (let i = 1; i <= Math.min(selectedRide.seats, 4); i++) {
        select.innerHTML += `<option value="${i}">${i} мест(а)</option>`;
      }

      document.getElementById('modal').style.display = 'flex';
    }

    function openCustomModal(day) {
      selectedRide = { id: "CUSTOM", dateStr: `${day} октября (по запросу)`, time: "в течение дня", seats: 4 };
      document.getElementById('modal-title').innerText = `Заявка на ${day} октября`;
      document.getElementById('modal-sub').innerText = `Направление: ${currentDir}`;

      const select = document.getElementById('input-seats');
      select.innerHTML = '';
      for (let i = 1; i <= 4; i++) {
        select.innerHTML += `<option value="${i}">${i} мест(а)</option>`;
      }

      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    async function confirmBooking() {
      const phone = document.getElementById('input-phone').value.trim();
      const seats = parseInt(document.getElementById('input-seats').value);
      const baggage = document.getElementById('input-bag').value;

      if (!phone || phone.length < 6) {
        alert('Пожалуйста, укажите корректный номер телефона');
        return;
      }

      const submitBtn = document.querySelector('.btn-submit');
      const prevText = submitBtn.innerText;
      submitBtn.innerText = 'Сохранение...';
      submitBtn.disabled = true;

      const payload = {
        user_id: vkUserData.id || 0,
        user_name: `${vkUserData.first_name} ${vkUserData.last_name}`.trim(),
        ride_id: selectedRide.id,
        direction: currentDir,
        date_text: `${selectedRide.dateStr}, ${selectedRide.time}`,
        seats: seats,
        baggage: baggage,
        phone: phone,
        is_custom: (selectedRide.id === "CUSTOM")
      };

      try {
        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          closeModal();
          alert('✅ Бронь успешно сохранена в таблице! Чек отправлен вам в сообщения сообщества.');
          if (window.vkBridge) {
            vkBridge.send('VKWebAppClose', { status: 'success' });
          }
        } else {
          const err = await response.json();
          alert('Ошибка бронирования: ' + (err.detail || 'Не удалось сохранить'));
          submitBtn.innerText = prevText;
          submitBtn.disabled = false;
        }
      } catch (e) {
        // Fallback-режим, если бэкенд ещё не поднят
        closeModal();
        alert('Заявка принята! Водитель свяжется с вами для подтверждения.');
        if (window.vkBridge) {
          vkBridge.send('VKWebAppClose', { status: 'success' });
        }
      }
    }

    // Первичная отрисовка
    render();
  </script>
</body>
</html>
